name: Deploy backend to EC2

# What a push to main means for the API: run the suite, and only if it passes,
# put that exact commit on the EC2 box and restart it under PM2. Deploying by
# hand is what left production running week-old code while the app expected
# endpoints that were not there yet.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  # Same pipeline, on demand — for a redeploy after changing the server's .env.
  workflow_dispatch:

# Read-only token for the whole workflow: a push to main deploys to
# production, so a token that could push is a way onto the server.
permissions:
  contents: read

concurrency:
  # One deploy at a time; a newer push cancels a queued older one.
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # npm ci runs third-party install scripts; the token must not be
          # sitting in .git/config for them to read.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # The suite runs on fakes — no database, no Redis, no paid API — so it is
      # safe to run on every push and means what it says when it is green.
      - run: npm test

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    # Only this repository's main: never a pull request, a manual run against
    # a branch, or a fork's main should the secrets ever be shared with one.
    if: github.ref == 'refs/heads/main' && github.repository == 'imshus/mrpscan'
    environment: production
    # No checkout here, so no token at all.
    permissions: {}
    steps:
      - name: Put this commit on the server and restart it
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
          PM2_NAME: ${{ secrets.EC2_PM2_NAME }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          for name in SSH_KEY HOST USER APP_DIR PM2_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret EC2_$name — see docs/deploy-github-actions.md"
              exit 1
            fi
          done

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # With the instance's host key on file, any other machine answering
          # at that address fails the step. Without it, the key presented at
          # this moment is trusted — say so, rather than pretend otherwise.
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
            strict=yes
          else
            echo "::warning::EC2_KNOWN_HOSTS is not set: trusting whichever host answers at EC2_HOST this run. See docs/deploy-github-actions.md."
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts
            strict=yes
          fi

          # The values travel as arguments, not as the remote environment:
          # pm2 restart --update-env would copy that environment into the API
          # process and pm2 save would write it to disk.
          remote_args=$(printf ' %q' "$APP_DIR" "$PM2_NAME" "$SHA")
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking="$strict" \
            "$USER@$HOST" "bash -s --$remote_args" <<'REMOTE'
          set -euo pipefail
          app_dir="$1"; pm2_name="$2"; sha="$3"
          cd "$app_dir"

          # Fast-forward only: if the server's checkout has commits or edits of
          # its own, stop and say so rather than throwing them away.
          git fetch --quiet origin main
          git -c advice.detachedHead=false merge --ff-only "$sha"

          cd backend
          # Production install from the lockfile: no dev packages on the box,
          # and no surprise minor versions between test and production.
          npm ci --omit=dev

          pm2 restart "$pm2_name" --update-env
          pm2 save --force
          REMOTE

      - name: Remove the deploy key from the runner
        if: always()
        run: shred -u ~/.ssh/deploy_key 2>/dev/null || rm -f ~/.ssh/deploy_key

      - name: Check the API came back on this commit
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="${HEALTH_URL:-https://appapi.mrpscan.com/api/v1/health}"

          # PM2 needs a moment to bind; ten tries at two seconds covers a cold
          # start without hiding a server that never came up.
          for attempt in $(seq 1 10); do
            body=$(curl -fsS --max-time 10 "$url" || true)
            if [ -n "$body" ]; then
              echo "$body"
              short="${SHA:0:7}"
              if printf '%s' "$body" | grep -q "\"commit\":\"$short\""; then
                echo "Deployed commit $short is serving."
                exit 0
              fi
              echo "API is up but not on $short yet (attempt $attempt)."
            else
              echo "No answer from $url yet (attempt $attempt)."
            fi
            sleep 2
          done

          echo "::error::The API did not come back on ${SHA:0:7}. Check pm2 logs on the server."
          exit 1
